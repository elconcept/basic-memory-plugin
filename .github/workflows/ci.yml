name: CI

on:
  push:
    branches: [main, impl/v1, 'sync/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile local source and tests
        run: python -m compileall -q scripts src tests

      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify pinned vendored upstream source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.sync_upstream import collect, digest
          lock = json.loads(Path("config/upstream.lock.json").read_text())
          cfg = json.loads(Path("config/build.json").read_text())
          files = collect(Path("vendor/upstream"))
          assert lock["upstream_sha"] == cfg["upstream_sha"], "build config/lock SHA mismatch"
          assert len(lock["upstream_sha"]) == 40, "invalid pinned SHA"
          assert lock["snapshot_digest"] == digest(files), "vendored upstream digest mismatch"
          assert lock["file_count"] == len(files), "vendored upstream file count mismatch"
          PY

      - name: Verify generated Claude and OpenAI packages match the pinned snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build.py --upstream vendor/upstream --out . --target claude --check
          # OpenAI M remains a candidate until platform OAuth is validated.
          python scripts/build.py --upstream vendor/upstream --out . --target openai --openai-variant M --check
          python -m compileall -q claude/src

      - name: Detect whitespace errors
        run: git diff --check

      - name: Scan repository secrets and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
