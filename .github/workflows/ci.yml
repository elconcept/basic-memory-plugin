name: CI

on:
  push:
    branches: [main, impl/v1, 'sync/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sync implementation
        run: python -m py_compile scripts/sync_upstream.py tests/test_sync_upstream.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check upstream lock syntax
        run: python -c "import json; p=json.load(open('config/upstream.lock.json')); assert len(p['upstream_sha'])==40"
      - name: Detect secrets in repository files
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
