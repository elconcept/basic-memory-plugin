name: Package Basic Memory ChatGPT plugin

# This publishes a GitHub release artifact, not a ChatGPT cloud release.
# Cloud releases require an authenticated Plugin Creator update operation.
on:
  push:
    branches: [main]
    paths:
      - 'chatgpt/**'
      - 'scripts/package_chatgpt_remote.py'
      - '.github/workflows/publish-chatgpt.yml'
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: chatgpt-skills-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify portable ChatGPT package with NAS MCP
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/package_chatgpt_remote.py --source chatgpt --zip "$RUNNER_TEMP/basic-memory-nas-chatgpt.zip" --metadata "$RUNNER_TEMP/basic-memory-nas-chatgpt.json"
      - name: Identify version and immutable commit release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("chatgpt/plugin.json"))["version"])')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "TAG=chatgpt-v${VERSION}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Publish immutable GitHub archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Archive already exists for this commit."
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/basic-memory-nas-chatgpt.zip#basic-memory-nas-chatgpt.zip" "$RUNNER_TEMP/basic-memory-nas-chatgpt.json#basic-memory-nas-chatgpt.json" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Basic Memory NAS ChatGPT v$VERSION (export)" --notes "Includes MCP endpoint and ChatGPT skill. GitHub artifact only: not an automatic update of the installed ChatGPT plugin." --latest
