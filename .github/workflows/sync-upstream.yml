name: Basic Memory upstream sync

# Daily: mirror upstream Basic Memory assets and commit them directly to main
# when tests (and the artifact build, once present) pass. No PR, no review gate.
# On failure nothing is committed and a single "upstream sync failed" issue is
# opened or updated.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: basic-memory-upstream-sync
  cancel-in-progress: false

jobs:
  upstream-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout plugin source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: basicmachines-co/basic-memory
          ref: main
          path: upstream
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize upstream assets (no upstream execution)
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if test -f config/build.json; then extra=(--build-config config/build.json); fi
          python scripts/sync_upstream.py \
            --source upstream \
            --dest vendor/upstream \
            --lock config/upstream.lock.json \
            "${extra[@]}" \
            --sha "$(git -C upstream rev-parse HEAD)" \
            --report "$RUNNER_TEMP/upstream-report.md"
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate plugin artifacts (when the generator exists)
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f scripts/build.py; then
            echo "No build generator yet: committing source snapshot only."
            exit 0
          fi
          python scripts/build.py --upstream vendor/upstream --out . --target claude
          python scripts/build.py --upstream vendor/upstream --out . --target openai --openai-variant M
          python scripts/build.py --upstream vendor/upstream --out . --target claude --check
          python scripts/build.py --upstream vendor/upstream --out . --target openai --openai-variant M --check
      - name: Commit and push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=(vendor/upstream config/upstream.lock.json)
          for p in config/build.json build-info.json claude openai; do
            test -e "$p" && paths+=("$p")
          done
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          sha="$(git -C upstream rev-parse --short HEAD)"
          git commit -q -F - <<EOF
          chore(upstream): sync Basic Memory to ${sha}

          $(cat "$RUNNER_TEMP/upstream-report.md" 2>/dev/null | head -c 20000)
          EOF
          git push origin HEAD:main
      - name: Report failure as a single issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='upstream sync failed'
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Nothing was committed to main."
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if test -n "$num"; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
