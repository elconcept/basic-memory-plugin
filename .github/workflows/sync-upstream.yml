name: Basic Memory upstream sync

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: basic-memory-upstream-sync
  cancel-in-progress: false

jobs:
  upstream-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          repository: basicmachines-co/basic-memory
          ref: main
          path: upstream
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize upstream assets (no upstream execution)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C upstream rev-parse HEAD)"
          python scripts/sync_upstream.py \
            --source upstream \
            --dest vendor/upstream \
            --lock config/upstream.lock.json \
            --build-config config/build.json \
            --sha "$sha" \
            --report "$RUNNER_TEMP/upstream-report.md"
      - name: Run snapshot tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prepare candidate artifacts without partial writes
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f scripts/build.py; then
            echo "state=staging" >> "$GITHUB_OUTPUT"
            echo "No build generator on main: snapshot is source staging only." >> "$RUNNER_TEMP/upstream-report.md"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/generated"
          if python scripts/build.py --upstream vendor/upstream --out "$RUNNER_TEMP/generated" --target claude &&
             python scripts/build.py --upstream vendor/upstream --out "$RUNNER_TEMP/generated" --target openai --openai-variant M &&
             python scripts/build.py --upstream vendor/upstream --out "$RUNNER_TEMP/generated" --target claude --check &&
             python scripts/build.py --upstream vendor/upstream --out "$RUNNER_TEMP/generated" --target openai --openai-variant M --check; then
            rm -rf claude openai
            cp -a "$RUNNER_TEMP/generated/claude" ./claude
            cp -a "$RUNNER_TEMP/generated/openai" ./openai
            echo "state=candidate" >> "$GITHUB_OUTPUT"
            printf '\nCandidate artifact build: succeeded (not deployment approval).\n' >> "$RUNNER_TEMP/upstream-report.md"
          else
            echo "state=blocked" >> "$GITHUB_OUTPUT"
            printf '\nCandidate artifact build: BLOCKED; review upstream changes and patch anchors. No generated artifact files were modified.\n' >> "$RUNNER_TEMP/upstream-report.md"
          fi
      - name: Choose only paths that actually exist
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            echo "vendor/upstream"
            echo "config/upstream.lock.json"
            test -f config/build.json && echo "config/build.json"
            test -d claude && echo "claude"
            test -d openai && echo "openai"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open or update a single review PR (never auto-merge)
        id: upstream_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/upstream
          base: main
          delete-branch: true
          draft: true
          title: 'chore(upstream): synchronize Basic Memory sources'
          commit-message: 'chore(upstream): update pinned Basic Memory sources'
          body-path: ${{ runner.temp }}/upstream-report.md
          add-paths: ${{ steps.paths.outputs.value }}

      - name: Explicitly dispatch CI for bot-created PR
        if: ${{ steps.upstream_pr.outputs.pull-request-number != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bot-created push/PR events do not trigger checks. workflow_dispatch does.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref sync/upstream
          echo "Dispatched CI for sync/upstream PR #${{ steps.upstream_pr.outputs.pull-request-number }}"

      - name: Signal blocked candidate build after PR is prepared
        if: ${{ steps.candidate.outputs.state == 'blocked' }}
        run: |
          echo "::error::Upstream candidate build blocked. Review sync/upstream PR and adapted skill sources."
          exit 1
